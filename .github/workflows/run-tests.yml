name: Run Tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: false

      - name: Install
        run: npm install

      - name: Unit tests
        run: npm test

      - name: Transform tests
        run: npm run test:transform

      - name: Wago and Wide integration
        env:
          # Wide PR #6 provides the imports exercised by this branch.
          WIDE_VERSION: ea40795012e0e230b234296acdb4881673bed136
        run: npm run test:wago-wide
